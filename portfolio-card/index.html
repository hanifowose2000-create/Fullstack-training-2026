<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Card website</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

  <div>
    <h1>Portfolio Card Design</h1>
  </div>

  <!--a Portfolio Card -->
  <div id="cards" class="card-grid">

    <!-- first card -->
    <div class="card">
      <!-- 1. Image, 2. Name, 3. Bio, 4. Title -->

      <img class="card-image"
        srcset=""
        alt="random image from net" />

      <div class="card-description">
        <h4 class="card-name"></h4>
        <p class="card-title"></p>
        <p class="card-bio"></p>
      </div>

    </div>
      
    
  </div>

  <script src="index.js"></script>
   
</body>

</html>
